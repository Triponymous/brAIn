[project]
name = "brain"
version = "0.1.0"
description = "A persistent neuromorphic brain with LLM bridge"
requires-python = ">=3.11,<3.13"
dependencies = [
    "snntorch>=0.9.1",
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    # Phase 3a — Mac sensor adapter + daemon
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pynput>=1.7",
    "sounddevice>=0.5",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    # Phase 3b — LLM bridge
    "anthropic>=0.40",
    # MCP server: brAIn as a context layer for Claude Code, Codex and friends
    "mcp>=2",
    # Phase 3c — Voice
    "piper-tts>=1.2",
    "pywhispercpp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
brain-mcp = "server.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain", "bridge", "server", "adapters", "capabilities"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
asyncio_mode = "auto"
